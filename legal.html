<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <style id="sama-gate-boot">html.sama-gate-checking body{visibility:hidden!important}html.sama-gate-blocked body>*:not(#sama-access-gate){display:none!important}</style>
  <script src="assets/js/access-gate.js"></script>
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal • Sama Apps</title>
  <meta name="description" content="Privacy Policy and Terms of Service" />
  <link rel="canonical" href="https://apps.samandari.dev/legal.html" />
  <link rel="alternate" hreflang="en" href="https://apps.samandari.dev/legal.html" />
  <link rel="alternate" hreflang="fr" href="https://apps.samandari.dev/legal.html?lang=fr" />
  <link rel="alternate" hreflang="x-default" href="https://apps.samandari.dev/legal.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/legal.css" />
  <link rel="stylesheet" href="assets/css/legal-page.css" />
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo">
        <img src="assets/img/logo.webp" alt="Sama Apps" class="header__logo-img" />
        <span>Sama Apps</span>
      </a>
      <nav class="header__nav">
        <button class="header__toggle" id="langToggle" title="Language">EN</button>
        <button class="header__toggle" id="themeToggle" title="Theme">
          <i class="bi bi-moon-fill"></i>
        </button>
        <a href="index.html" class="header__link header__link--back" id="backLink">
          <i class="bi bi-arrow-left"></i> <span id="backLabel"></span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <div class="legal-content" id="legalContent"></div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p id="footerRights"></p>
      <p class="footer__credit"><span id="footerBuilt"></span> <a href="https://www.samandari.dev/" target="_blank">Samandari</a></p>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/apps.js"></script>
  <script src="assets/js/legal-full.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    renderLegalPage();
    var langBtn = document.getElementById("langToggle");
    if (!langBtn) return;
    langBtn.addEventListener("click", function () {
      var params = new URLSearchParams(window.location.search);
      var appId = params.get("id");
      var langs = (appId === "esama") ? ["en", "fr", "sw"] : ["en", "fr"];
      var cur = params.get("lang") || getLang();
      if (langs.indexOf(cur) < 0) cur = "en";
      var next = langs[(langs.indexOf(cur) + 1) % langs.length];
      setLang(next);
      params.set("lang", next);
      window.location.search = params.toString();
    });
  });

  function legalPick(obj, lang) {
    if (!obj) return "";
    return obj[lang] || obj.en || "";
  }

  function legalFormatContent(text) {
    if (!text) return "";
    var blocks = text.split("\n\n");
    var h = "";
    for (var i = 0; i < blocks.length; i++) {
      var block = blocks[i];
      var lines = block.split("\n");
      var isList = lines.length > 0 && lines.every(function (line) {
        return line.trim() === "" || line.trim().indexOf("•") === 0;
      }) && lines.some(function (line) { return line.trim().indexOf("•") === 0; });
      if (isList) {
        h += "<ul>";
        for (var j = 0; j < lines.length; j++) {
          var item = lines[j].replace(/^\s*•\s*/, "").trim();
          if (item) h += "<li><span>" + item + "</span></li>";
        }
        h += "</ul>";
      } else {
        h += "<p>" + block.replace(/\n/g, "<br />") + "</p>";
      }
    }
    return h;
  }

  function renderFullDoc(doc, lang, headingKey) {
    var h = "";
    h += "<h1>" + t(headingKey) + "</h1>";
    h += '<p class="legal-intro">' + legalPick(doc.intro, lang) + "</p>";
    for (var i = 0; i < doc.sections.length; i++) {
      var sec = doc.sections[i];
      h += '<div class="legal-section"><h2>' + legalPick(sec.title, lang) + "</h2>";
      h += legalFormatContent(legalPick(sec.content, lang));
      h += "</div>";
    }
    return h;
  }

  function renderLegalPage() {
    var params = new URLSearchParams(window.location.search);
    var appId = params.get("id");
    var page = params.get("page") || "privacy";
    var forceLang = params.get("lang");
    if (forceLang && I18N[forceLang]) {
      setLang(forceLang);
    }
    var toggle = document.getElementById("langToggle");
    if (toggle) toggle.textContent = getLang().toUpperCase();
    document.documentElement.lang = getLang();
    var app = null;

    for (var i = 0; i < APPS.length; i++) {
      if (APPS[i].id === appId) { app = APPS[i]; break; }
    }

    var container = document.getElementById("legalContent");
    var backLabel = document.getElementById("backLabel");
    if (backLabel) backLabel.textContent = t("legal_back_to_app");

    var backLink = document.getElementById("backLink");
    if (backLink && app) backLink.href = "app.html?id=" + app.id;

    if (!app || !app.legal) {
      container.innerHTML = '<h1>' + t("app_not_found") + '</h1><p>' + t("app_not_found_desc") + '</p><a href="index.html" class="btn btn--primary">' + t("back_to_store") + '</a>';
      return;
    }

    var legal = app.legal;
    var lang = getLang();
    if (appId === "esama" && lang !== "en" && lang !== "fr" && lang !== "sw") lang = "en";
    if (appId === "velora" && lang !== "en" && lang !== "fr") lang = "en";
    document.title = (page === "privacy" ? t("privacy_policy") : t("terms_of_service")) + " • " + app.name + " | Sama Apps";

    var langParam = getLang();
    var privacyUrl = "legal.html?id=" + app.id + "&page=privacy&lang=" + langParam;
    var termsUrl = "legal.html?id=" + app.id + "&page=terms&lang=" + langParam;

    var html = '';
    html += '<div class="legal-meta">';
    html += '<div class="app-badge"><img src="' + app.icon + '" alt="' + app.name + '" /><span>' + app.name + '</span></div><br />';
    html += '<span>' + t("legal_effective").replace("{date}", legal.effectiveDate) + '</span>';
    html += '</div>';

    html += '<div class="legal-tabs">';
    html += '<a href="' + privacyUrl + '" class="legal-tab' + (page === "privacy" ? " active" : "") + '">' + t("privacy_policy") + '</a>';
    html += '<a href="' + termsUrl + '" class="legal-tab' + (page === "terms" ? " active" : "") + '">' + t("terms_of_service") + '</a>';
    html += '</div>';

    var usedFull = false;
    if (page === "privacy") {
      usedFull = typeof LEGAL_FULL !== "undefined" && LEGAL_FULL[app.id] && LEGAL_FULL[app.id].privacy;
      if (usedFull) {
        html += renderFullDoc(LEGAL_FULL[app.id].privacy, lang, "privacy_policy");
      } else {
        html += renderPrivacy(app, legal, lang);
      }
    } else {
      usedFull = typeof LEGAL_FULL !== "undefined" && LEGAL_FULL[app.id] && LEGAL_FULL[app.id].terms;
      if (usedFull) {
        html += renderFullDoc(LEGAL_FULL[app.id].terms, lang, "terms_of_service");
      } else {
        html += renderTerms(app, legal, lang);
      }
    }
    if (usedFull && (legal.instagram || legal.facebook)) {
      html += '<div class="legal-section"><h2>' + t("legal_contact_title") + '</h2>';
      html += contactBlock(legal);
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function contactBlock(legal) {
    var h = '<div class="legal-contact"><a href="mailto:' + legal.email + '">' + legal.email + '</a></div>';
    if (legal.instagram) {
      h += '<div class="legal-contact"><a href="' + legal.instagram + '" target="_blank" rel="noopener noreferrer"><i class="bi bi-instagram"></i> Instagram</a></div>';
    }
    if (legal.facebook) {
      h += '<div class="legal-contact"><a href="' + legal.facebook + '" target="_blank" rel="noopener noreferrer"><i class="bi bi-facebook"></i> Facebook</a></div>';
    }
    return h;
  }

  function renderPrivacy(app, legal, lang) {
    var h = '';
    h += '<h1>' + t("privacy_policy") + '</h1>';
    h += '<p class="legal-intro">' + t("legal_intro_privacy").replace("{app}", app.name).replace("{dev}", legal.developer) + '</p>';

    var dataLocal = legal["dataLocal_" + lang] || legal.dataLocal;
    h += '<div class="legal-section"><h2>' + t("legal_data_local_title") + '</h2>';
    h += '<p>' + t("legal_data_local_desc") + '</p><ul>';
    for (var i = 0; i < dataLocal.length; i++) {
      h += '<li><span>' + dataLocal[i] + '</span></li>';
    }
    h += '</ul></div>';

    var dataCloud = legal["dataCloud_" + lang] || legal.dataCloud;
    if (dataCloud && dataCloud.length > 0) {
      h += '<div class="legal-section"><h2>' + t("legal_data_cloud_title") + '</h2>';
      h += '<p>' + t("legal_data_cloud_desc") + '</p><ul>';
      for (var j = 0; j < dataCloud.length; j++) {
        h += '<li><span>' + dataCloud[j] + '</span></li>';
      }
      h += '</ul></div>';
    }

    if (legal.thirdParty && legal.thirdParty.length > 0) {
      h += '<div class="legal-section"><h2>' + t("legal_third_party_title") + '</h2>';
      h += '<p>' + t("legal_third_party_desc") + '</p>';
      for (var k = 0; k < legal.thirdParty.length; k++) {
        var tp = legal.thirdParty[k];
        var purpose = tp["purpose_" + lang] || tp.purpose;
        h += '<div class="third-party-item"><span><span class="tp-name">' + tp.name + '</span> • <span class="tp-purpose">' + purpose + '</span></span></div>';
      }
      h += '</div>';
    }

    if (legal.privacyExtra) {
      for (var x = 0; x < legal.privacyExtra.length; x++) {
        var ex = legal.privacyExtra[x];
        var exTitle = ex["title_" + lang] || ex.title;
        var exDesc = ex["desc_" + lang] || ex.desc;
        h += '<div class="legal-section"><h2>' + exTitle + '</h2><p>' + exDesc + '</p></div>';
      }
    }

    if (legal.noAnalytics) {
      h += '<div class="legal-highlight"><i class="bi bi-shield-check"></i> ' + t("legal_no_analytics") + '</div>';
    }
    if (legal.noAds) {
      h += '<div class="legal-highlight"><i class="bi bi-shield-check"></i> ' + t("legal_no_ads") + '</div>';
    }

    h += '<div class="legal-section"><h2>' + t("legal_security_title") + '</h2>';
    h += '<p>' + t("legal_security_desc") + '</p></div>';

    h += '<div class="legal-section"><h2>' + t("legal_children_title") + '</h2>';
    h += '<p>' + t("legal_children_desc") + '</p></div>';

    h += '<div class="legal-section"><h2>' + t("legal_changes_title") + '</h2>';
    h += '<p>' + t("legal_changes_desc") + '</p></div>';

    h += '<div class="legal-section"><h2>' + t("legal_contact_title") + '</h2>';
    h += '<p>' + t("legal_contact_desc") + '</p>';
    h += contactBlock(legal) + '</div>';

    return h;
  }

  function renderTerms(app, legal, lang) {
    var h = '';
    h += '<h1>' + t("terms_of_service") + '</h1>';
    h += '<p class="legal-intro">' + t("legal_terms_intro").replace("{app}", app.name) + '</p>';

    var sections = [
      { title: "legal_terms_license_title", desc: "legal_terms_license_desc", replace: { "{dev}": legal.developer } },
      { title: "legal_terms_use_title", desc: "legal_terms_use_desc" },
      { title: "legal_terms_data_title", desc: "legal_terms_data_desc" },
      { title: "legal_terms_disclaimer_title", desc: "legal_terms_disclaimer_desc" },
      { title: "legal_terms_termination_title", desc: "legal_terms_termination_desc" },
      { title: "legal_terms_changes_title", desc: "legal_terms_changes_desc" },
      { title: "legal_terms_law_title", desc: "legal_terms_law_desc", replace: { "{country}": legal.country } }
    ];

    for (var i = 0; i < sections.length; i++) {
      var s = sections[i];
      var desc = t(s.desc);
      if (s.replace) {
        for (var key in s.replace) {
          desc = desc.replace(key, s.replace[key]);
        }
      }
      h += '<div class="legal-section"><h2>' + t(s.title) + '</h2><p>' + desc + '</p></div>';
    }

    if (legal.termsExtra) {
      for (var x = 0; x < legal.termsExtra.length; x++) {
        var ex = legal.termsExtra[x];
        var exTitle = ex["title_" + lang] || ex.title;
        var exDesc = ex["desc_" + lang] || ex.desc;
        h += '<div class="legal-section"><h2>' + exTitle + '</h2><p>' + exDesc + '</p></div>';
      }
    }

    h += '<div class="legal-section"><h2>' + t("legal_contact_title") + '</h2>';
    h += '<p>' + t("legal_contact_desc") + '</p>';
    h += contactBlock(legal) + '</div>';

    return h;
  }
  </script>
</body>
</html>
